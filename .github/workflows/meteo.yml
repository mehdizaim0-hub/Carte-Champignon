name: Calibrage météo (GBIF x Open-Meteo)
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Budget Open-Meteo pour ce passage (quota gratuit : 10000/jour, 5000/heure)"
        default: "3000"
  push:
    branches: [calibrage-meteo]
    paths: [research/lancer-meteo.txt]
permissions:
  contents: write
concurrency:
  group: calibrage-meteo
  cancel-in-progress: false
jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Calibrage (avec commits de progression toutes les 4 minutes)
        shell: bash
        env:
          METEO_BUDGET: ${{ inputs.budget || '3000' }}
          METEO_MAXMIN: "100"
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          save() {
            for f in research/meteo-cache.json.gz research/meteo-obs.json.gz research/calibration-meteo.json research/calibration-meteo.txt; do
              if [ -e "$f" ]; then git add -f "$f"; fi
            done
            git commit -q -m "calibrage météo : $1" || return 0
            for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break || sleep 5; done
          }
          python3 -u tools/gbif_meteo.py > research/calibration-meteo.txt 2>&1 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            for i in $(seq 1 24); do kill -0 $PID 2>/dev/null || break; sleep 10; done
            save "progression"
          done
          wait $PID; RC=$?
          save "résultat (code $RC)"
          exit $RC
