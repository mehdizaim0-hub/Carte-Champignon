name: Zones artificialisées et milieux ouverts (manuel)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  urbain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_urbain.py --max-seconds 6000
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add urbain.json
          git commit -m "urbain.json v2 : agglomérations et milieux ouverts" || echo "rien"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
