name: Relief (manuel)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  relief:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages numpy pillow
      - run: python3 build_relief.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add relief.json
          git commit -m "relief : altitude, pente, exposition, position topographique" || echo "rien"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
