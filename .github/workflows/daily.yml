name: Mise à jour quotidienne
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_data.py
      - name: Contrôle des données (rien n'est publié si elles sont invalides)
        run: python3 tests/validate_data.py --fresh
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "data $(date -u +%F)" || echo "rien à commiter"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
