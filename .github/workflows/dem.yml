name: Test relief (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/dem_test.py 2>&1 | tee tools/dem_out.txt
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/dem_out.txt
          git commit -m "test relief" || true
          git pull --rebase
          git push
