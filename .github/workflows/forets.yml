name: Forêt à fine échelle (manuel)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  forets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_forets.py --max-seconds 6000
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add forets.json
          git commit -m "forêt fine IGN (480 px)" || echo "rien"
          git pull --rebase
          git push
