name: Test photos Wikipédia (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/wiki.py 2>&1 | tee tools/wiki_out.txt
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/wiki_out.txt
          git commit -m "test wikipédia" || true
          git pull --rebase
          git push
