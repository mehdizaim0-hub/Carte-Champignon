name: Exploration données (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/explore2.py 2>&1 | tee tools/explore_out2.txt
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/explore_out2.txt tools/color_map.json
          git commit -m "résultat exploration" || true
          git pull --rebase
          git push
