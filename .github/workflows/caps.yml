name: Couches IGN (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/caps.py 2>&1 | tee tools/caps_out.txt
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/caps_out.txt tools/*.png
          git commit -m "couches IGN" || true
          git pull --rebase
          git push
