name: Masques agglomérations et routes (manuel)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  masques:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_routes.py
      - run: python3 build_urbain.py --max-seconds 6000
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add routes.json urbain.json
          git commit -m "masques : routes principales et zones artificialisées" || echo "rien"
          git pull --rebase
          git push
